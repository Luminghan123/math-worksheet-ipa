name: 构建未签名 IPA（TrollStore 巨魔）

# 巨魔用 CoreTrust 漏洞永久签名，能装「未签名」ipa。
# 因此这里在 GitHub 的 macOS 云端构建机上直接关闭代码签名出包，
# 不需要 Apple Developer 账号、证书、描述文件，也不需要本地 Mac。
#
# 打包环节的几处处理（清理 AppleDouble 元数据 / ad-hoc 签名 / zip -X / 结构校验）
# 参考了本账号 rt-records-ios 仓库里已跑通的未签名 IPA 工作流，避免巨魔解析 IPA 报错。

on:
  push:
    branches: ['**']
    paths:
      - '.github/workflows/build-unsigned-ipa.yml'
      - 'index.html'
      - 'ios-shell/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-unsigned-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 打印构建环境（出错时方便排查）
        run: |
          xcodebuild -version
          node --version
          pod --version || true

      - name: 安装 npm 依赖
        working-directory: ios-shell
        run: npm install --no-audit --no-fund

      - name: 生成 Capacitor iOS 工程
        working-directory: ios-shell
        run: |
          npx cap add ios
          npx cap sync ios

      - name: 安装 CocoaPods 依赖
        working-directory: ios-shell/ios/App
        run: |
          if [ -f Podfile ]; then pod install; else echo "无 Podfile，跳过"; fi

      - name: 关闭 Xcode 工程里的自动签名
        working-directory: ios-shell
        run: python3 scripts/disable-signing.py ios/App/App.xcodeproj/project.pbxproj

      - name: 构建未签名 archive
        working-directory: ios-shell
        run: |
          xcodebuild clean archive \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath build/App.xcarchive \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            ONLY_ACTIVE_ARCH=NO \
            IPHONEOS_DEPLOYMENT_TARGET=14.0 \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: 打包成 IPA（Payload/*.app）
        working-directory: ios-shell
        run: |
          set -e
          APP=$(find build/App.xcarchive/Products/Applications -maxdepth 1 -name '*.app' -print -quit)
          if [ -z "$APP" ] || [ ! -d "$APP" ]; then
            echo "::error::未找到 .app，构建可能失败"
            find build -maxdepth 6 -name '*.app' -type d || true
            exit 1
          fi
          echo "使用 App: $APP"
          echo "确认未签名："
          codesign -dv "$APP" 2>&1 | head -n 3 || true
          rm -rf Payload math-worksheet-unsigned.ipa
          mkdir Payload
          cp -R "$APP" Payload/

          # 清掉 macOS 元数据：TrollStore 解析 IPA 时遇到 ._ 开头的 AppleDouble 文件会报错
          xattr -cr Payload 2>/dev/null || true
          find Payload -name '._*' -delete 2>/dev/null || true
          find Payload -name '.DS_Store' -delete 2>/dev/null || true

          # 补一层 ad-hoc 签名：TrollStore 本来就能自己签，
          # 但带上标准签名结构后，爱思助手 / Filza 等安装器也能识别
          APPNAME=$(basename "$APP")
          codesign -f -s - --deep "Payload/$APPNAME" 2>/dev/null \
            || echo "ad-hoc 签名跳过（TrollStore 仍可正常安装）"

          # -y 保留符号链接（framework 需要），-X 不写扩展属性（避免生成 __MACOSX）
          zip -qrXy math-worksheet-unsigned.ipa Payload
          ls -lh math-worksheet-unsigned.ipa

      - name: 校验 IPA 结构
        working-directory: ios-shell
        run: |
          set -e
          unzip -l math-worksheet-unsigned.ipa | grep -q 'Payload/.*\.app/Info.plist'
          if unzip -l math-worksheet-unsigned.ipa | grep -q '__MACOSX'; then
            echo "::error::IPA 里混入了 macOS 元数据"; exit 1
          fi
          echo "IPA 结构校验通过（Payload/*.app/Info.plist）"
          unzip -l math-worksheet-unsigned.ipa | tail -n 5

      - name: 上传构建产物（Artifact，保留 30 天）
        uses: actions/upload-artifact@v4
        with:
          name: math-worksheet-unsigned-ipa
          path: ios-shell/math-worksheet-unsigned.ipa
          retention-days: 30
          if-no-files-found: error

      - name: 发布到 Releases（手机 Safari 可直接下载）
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=ipa-latest
          IPA=ios-shell/math-worksheet-unsigned.ipa
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$IPA" --clobber
          else
            gh release create "$TAG" "$IPA" \
              --title "口算题卡 · 未签名 IPA（巨魔）" \
              --notes "GitHub Actions 自动构建的未签名 IPA，供 TrollStore / 巨魔助手安装使用。"
          fi
